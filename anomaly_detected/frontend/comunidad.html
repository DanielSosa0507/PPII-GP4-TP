{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anomaly Detected - Comunidad</title>
    <script>
        (function () {
            var manual = localStorage.getItem('temaPreferencia');
            var esDeDia = manual === 'claro' || manual === 'oscuro'
                ? manual === 'claro'
                : (new Date().getHours() >= 6 && new Date().getHours() < 18);
            if (esDeDia) document.documentElement.classList.add('light-theme');
        })();
    </script>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="body-cyber">
    {% include 'partials/navbar.html' with active='comunidad' %}

    <main class="page-container">
        <section class="feed">
            <div class="community-header">
                <h2>Comunidad</h2>
            </div>

            <div class="post-creator">
                <div class="avatar">👤</div>
                <div class="post-creator-campos">
                    <input type="text" id="teoriaTitulo" placeholder="Título de tu teoría...">
                    <textarea id="teoriaContenido" placeholder="Compartí tu teoría sobre algún fenómeno..."></textarea>
                    <button class="btn-publish" type="button" id="btnPublicarTeoria">Publicar</button>
                </div>
            </div>

            <div id="teoriasFeed">
                <p class="ficha-vacio">Cargando teorías…</p>
            </div>
        </section>

        <aside class="sidebar-comunidad">
            <div class="sidebar-box">
                <h3>PRÓXIMOS EVENTOS</h3>
                <p><strong>31 OCT</strong> - Ruta embrujada — Halloween</p>
                <p><strong>15 JUL</strong> - Noche de avistamientos, Roswell</p>
                <p><strong>20 AGO</strong> - Exploración Area 51</p>
            </div>
        </aside>
    </main>

    <script src="{% static 'js/script.js' %}"></script>
    <script src="{% static 'js/comunidad.js' %}"></script>
</body>
</html>
