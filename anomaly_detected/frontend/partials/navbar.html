{% load static %}
<header class="navbar-superior">
    <a href="{% url 'index' %}" class="nav-logo">
        <img src="{% static 'img/logo-modo-nocturno.png' %}" alt="Anomaly Detected" class="logo-icon logo-icon-noche">
        <img src="{% static 'img/logo-modo-diurno.png' %}" alt="Anomaly Detected" class="logo-icon logo-icon-dia"> ANOMALY DETECTED
    </a>
    <nav class="nav-links">
        <a href="{% url 'mapa' %}" class="{% if active == 'mapa' %}active{% endif %}">Mapa</a>
        <a href="{% url 'reportes' %}" class="{% if active == 'reportes' %}active{% endif %}">Reportes</a>
        <a href="{% url 'comunidad' %}" class="{% if active == 'comunidad' %}active{% endif %}">Comunidad</a>
        <a href="{% url 'favoritos' %}" class="{% if active == 'favoritos' %}active{% endif %}">Favoritos</a>
        {% if user.is_authenticated %}
        <a href="{% url 'mis_fenomenos' %}" class="{% if active == 'mis_fenomenos' %}active{% endif %}">Mis Fenómenos</a>
        {% endif %}
        {% if user.is_authenticated and user.rol == 'admin' %}
        <a href="{% url 'panel_admin' %}" class="{% if active == 'panel_admin' %}active{% endif %}">Panel Admin</a>
        {% endif %}
    </nav>
    <div class="nav-user">
        <button type="button" class="theme-toggle-btn" aria-label="Cambiar entre modo claro y oscuro">
            <span class="theme-toggle-thumb"></span>
        </button>
        {% if user.is_authenticated %}
            <a href="{% url 'perfil' %}" class="user-avatar" title="Mi perfil">👤</a>
        {% else %}
            <a href="{% url 'login' %}" class="user-avatar" title="Iniciar sesión">👤</a>
        {% endif %}
    </div>
</header>
