{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anomaly Detected - Editar Perfil</title>
        <link rel="icon" type="image/png" href="{% static 'img/Logo_final.png' %}">
    <script>
        (function () {
            var manual = localStorage.getItem('temaPreferencia');
            var esDeDia = manual === 'claro' || manual === 'oscuro'
                ? manual === 'claro'
                : (new Date().getHours() >= 6 && new Date().getHours() < 18);
            if (esDeDia) document.documentElement.classList.add('light-theme');
        })();
    </script>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="body-cyber">
    {% include 'partials/navbar.html' with active='perfil' %}

    <main class="container perfil-container">

        <a href="{% url 'perfil' %}" class="back-link">← Volver a mi perfil</a>

        <section class="perfil-form-card">
            <h1 class="form-main-title">Editar perfil</h1>

            <form method="POST" action="" enctype="multipart/form-data" class="form-cyber">
                {% csrf_token %}

                <div class="form-group full-width">
                    <label>Foto de perfil <span class="opcional">(opcional)</span></label>
                    <div class="upload-zone-cyber">
                        {% if usuario.foto_perfil %}
                            <img src="{{ usuario.foto_perfil.url }}" alt="Foto actual" class="perfil-preview-img">
                        {% endif %}
                        <input type="file" name="foto_perfil" accept="image/*" class="input-cyber">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Nombre</label>
                        <input type="text" name="nombre" value="{{ usuario.nombre|default:'' }}" placeholder="Tu nombre" class="input-cyber">
                    </div>
                    <div class="form-group">
                        <label>Apellido</label>
                        <input type="text" name="apellido" value="{{ usuario.apellido|default:'' }}" placeholder="Tu apellido" class="input-cyber">
                    </div>
                </div>

                <div class="form-group full-width">
                    <label>Nivel de cazador paranormal</label>
                    <select name="nivel" class="select-cyber">
                        {% for valor, etiqueta in usuario.NIVELES %}
                            <option value="{{ valor }}" {% if usuario.nivel == valor %}selected{% endif %}>{{ etiqueta }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group full-width">
                    <label>Bio <span class="opcional">(opcional)</span></label>
                    <textarea name="bio" placeholder="Contanos sobre vos y tu interés en lo paranormal..." class="textarea-cyber">{{ usuario.bio|default:'' }}</textarea>
                </div>

                <div class="form-actions full-width">
                    <button type="submit" class="btn-submit-cyber">💾 Guardar cambios</button>
                    <a href="{% url 'perfil' %}" class="btn-cancel-cyber">Cancelar</a>
                </div>
            </form>
        </section>

    </main>

    <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
