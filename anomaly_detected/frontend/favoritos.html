{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anomaly Detected - Favoritos</title>
    <script>
        (function () {
            var hora = new Date().getHours();
            var esDeDia = hora >= 6 && hora < 18;
            if (esDeDia) document.documentElement.classList.add('light-theme');
        })();
    </script>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="body-cyber">
    {% include 'partials/navbar.html' with active='favoritos' %}

    <main class="container">

        <section class="content-header">
            <h1 class="main-title">
                ♡ Mis favoritos
            </h1>
            <div class="filter-tags">
                <button class="tag active" data-filtro="todos">Todos</button>
                <button class="tag" data-filtro="ovni">OVNIs</button>
                <button class="tag" data-filtro="embrujado">Embrujados</button>
            </div>
        </section>

        <section class="cards-grid" id="favoritosGrid">
            <p class="favoritos-cargando">Cargando favoritos…</p>
        </section>
    </main>

    <script src="{% static 'js/script.js' %}"></script>
    <script src="{% static 'js/favoritos.js' %}"></script>
</body>
</html>
