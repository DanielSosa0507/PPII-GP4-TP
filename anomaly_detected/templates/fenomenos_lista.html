{% extends 'base.html' %}

{% block content %}
<div class="container">
    <div class="row mb-5 text-center">
        <div class="col">
            <h2 class="display-4 fw-bold text-white" style="text-shadow: 0 0 15px rgba(102, 252, 241, 0.5);">
                📂 Archivos Clasificados
            </h2>
            <p class="text-light opacity-75">Base de datos global de incidentes, avistamientos y anomalías bajo investigación.</p>
            <hr class="my-4" style="border-top: 1px solid #45f3ff; width: 40%; margin: 0 auto;">
        </div>
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" id="contenedor-cards">
        <div class="col-12 text-center py-5" id="cargando-status">
            <div class="spinner-border text-info" role="status">
                <span class="visually-hidden">Cargando archivos secretos...</span>
            </div>
            <p class="text-muted mt-2">Sincronizando con el servidor central...</p>
        </div>
    </div>
</div>

<script>
    // Vamos a buscar los fenómenos a tu API de Django REST Framework
    fetch('/api/fenomenos/')
        .then(response => response.json())
        .then(data => {
            const contenedor = document.getElementById('contenedor-cards');
            const spinner = document.getElementById('cargando-status');
            
            // Borramos el spinner de carga
            spinner.remove();

            // Si no hay datos cargados todavía, mostramos un aviso amigable
            if (data.length === 0) {
                contenedor.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <div class="alert alert-dark border-secondary text-light p-4" role="alert">
                            ⚠️ No se registran anomalías en la base de datos por el momento.
                        </div>
                    </div>`;
                return;
            }

            // Recorremos cada fenómeno que creaste en tu base de datos
            data.forEach(anomalia => {
                // Creamos la estructura de la Card de Bootstrap
                const cardHtml = `
                    <div class="col">
                        <div class="card h-100 border-0 text-light" style="background-color: #1f2833; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border-radius: 10px; transition: 0.3s;" onmouseover="this.style.transform='scale(1.02)'" onmouseout="this.style.transform='scale(1)'">
                            
                            <div style="height: 200px; background-color: #0b0c10; display: flex; align-items: center; justify-content: center; border-top-left-radius: 10px; border-top-right-radius: 10px; border-bottom: 2px solid #45f3ff;">
                                <span style="font-size: 4rem;">🛸</span>
                            </div>

                            <div class="card-body d-flex flex-column">
                                <span class="badge mb-2" style="background-color: #0b0c10; color: #66fcf1; border: 1px solid #66fcf1; width: fit-content;">
                                    ${anomalia.categoria || 'Anomalía'}
                                </span>
                                <h5 class="card-title fw-bold text-white mb-2">${anomalia.titulo}</h5>
                                <p class="card-text text-light opacity-75 flex-grow-1" style="font-size: 0.95rem;">
                                    ${anomalia.descripcion ? anomalia.descripcion.substring(0, 120) + '...' : 'Sin descripción detallada.'}
                                </p>
                                <div class="mt-3 pt-3 border-top border-secondary d-flex justify-content-between align-items-center">
                                    <small class="text-secondary">📍 Lat: ${anomalia.latitud}</small>
                                    <a href="#" class="btn btn-sm px-3 fw-bold" style="background-color: #66fcf1; color: #0b0c10;">Ver Expediente</a>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                // Inyectamos la tarjeta en el contenedor de la pantalla
                contenedor.innerHTML += cardHtml;
            });
        })
        .catch(error => {
            console.error('Error al conectar con los archivos clasificados:', error);
            document.getElementById('contenedor-cards').innerHTML = `
                <div class="col-12 text-center py-5">
                    <p class="text-danger">⚠️ Error en la conexión con el servidor central.</p>
                </div>`;
        });
</script>
{% endblock %}
